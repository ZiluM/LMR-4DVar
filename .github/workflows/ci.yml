name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Report test failures
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          report = Path("pytest-results.xml")
          if report.exists():
              for case in ElementTree.parse(report).iter("testcase"):
                  for tag in ("failure", "error"):
                      for failure in case.findall(tag):
                          message = "\n".join((case.attrib.get("name", "test"),
                                               failure.attrib.get("message", ""),
                                               (failure.text or "")[-3000:]))
                          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                          print("::error::" + message[:16000])
          PY
